<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boardmine</title>
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand-row">
        <img src="assets/picto.svg" class="brand-picto" alt="" width="16" height="21" />
        <img src="assets/wordmark.svg" class="brand-wordmark" alt="Boardmine" height="15" />
      </div>
      <span id="count" class="muted"></span>
    </header>

    <section class="boards">
      <p class="section-label">Capture to</p>
      <ul id="board-list" class="board-list" role="radiogroup" aria-label="Target board"></ul>
    </section>

    <div class="hero">
      <button id="pick-zone" type="button" class="btn btn-primary btn-hero">
        Capture a zone of this page
      </button>
      <p id="pick-error" class="pick-error" hidden></p>
    </div>

    <footer>
      <button id="capture-all" type="button" class="btn">Capture all</button>
      <button id="open-options" type="button" class="btn">Settings</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
