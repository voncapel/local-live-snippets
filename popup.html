<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Live Snippets</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Local Live Snippets</strong>
      <span id="count" class="muted"></span>
    </header>

    <div class="hero">
      <button id="pick-zone" type="button" class="btn btn-primary btn-hero">
        Capture a zone of this page
      </button>
      <p id="pick-error" class="pick-error" hidden></p>
    </div>

    <ul id="list"></ul>
    <p id="empty" class="muted" hidden>No snippets configured.</p>

    <footer>
      <button id="capture-all" type="button" class="btn btn-primary">Capture all</button>
      <button id="open-options" type="button" class="btn">Settings</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
